name = "dslq-questionnaire"
main = "src/worker.js"
compatibility_date = "2026-09-18"
workers_dev = true
routes = [{ pattern = "dslq.dogperspective.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dslq_research"
database_id = "7ee34b2d-eee5-432b-9f69-f149f7372d92"
migrations_dir = "migrations"
